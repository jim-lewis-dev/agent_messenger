name: Test
on: [push, pull_request]
jobs:
  messenger:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y nats-server
      - run: python -m pip install .
      - run: python -W error::RuntimeWarning -m unittest discover -s tests -v
        env:
          REQUIRE_NATS_SERVER: "1"
      - name: Check installed tools outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          agent-messenger-terminal --help
          agent-messenger-monitor --help
